app: hello
env: obs
providers:
  infra: hetzner
  storage: cloudflare # required when monitor: is set — Loki + Thanos buckets land here
  dns: cloudflare
acme_email: ops@nvoi.to
ssh_key: ~/.ssh/id_rsa.pub

servers:
  master: { type: cax21, region: nbg1, role: master }
  worker: { type: cax21, region: nbg1, role: worker }

# A token app workload so the per-service dashboards (overview /
# services / deploys) have something real to graph. Replace with
# your own services in copies of this example.
services:
  whoami:
    image: traefik/whoami
    port: 80

# Observability stack — Prometheus + Thanos + Loki + Grafana, all
# bucket-backed via providers.storage. Presence of `monitor:` is the
# toggle (same convention as `domains:` / `build:` / `storage:`).
#
# Minimum form below — tunnel-only access via `nvoi monitor`, no
# alert routing (alerts surface on the Grafana home page only).
# Works against a base .env containing just HCLOUD_TOKEN +
# CF_API_KEY + CF_ACCOUNT_ID + CF_ZONE_ID + CF_ZONE.
monitor: {}
#
# ── To enable public Ingress + real alerts, uncomment + set env vars ──
#
# monitor:
#   domain: grafana.nvoi.to              # public Ingress with cert-manager TLS
#   admin_password: $GRAFANA_ADMIN_PWD   # required when domain: is set
#
#   alerts:
#     slack: $SLACK_WEBHOOK_URL
#     email:
#       provider: postmark
#       token: $POSTMARK_SERVER_TOKEN
#       from: alerts@nvoi.to
#       to: [ops@nvoi.to]
#     sms:
#       provider: twilio
#       account: $TWILIO_ACCOUNT_SID
#       token: $TWILIO_AUTH_TOKEN
#       from: $TWILIO_FROM_NUMBER
#       to: ["+33611223344"]
