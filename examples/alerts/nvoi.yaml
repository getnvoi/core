apiVersion: 1
groups:
  - orgId: 1
    name: nvoi
    folder: nvoi
    interval: 1m
    rules:
      - uid: nvoi-node-not-ready
        title: "Node not Ready"
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'kube_node_status_condition{condition="Ready",status="true"} == 0'
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A cluster node is not Ready"

      - uid: nvoi-deployment-replicas-not-ready
        title: "Deployment ready replicas below desired"
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'kube_deployment_status_replicas_ready{namespace="default"} < kube_deployment_spec_replicas{namespace="default"}'
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.deployment }} has fewer ready replicas than desired"

      - uid: nvoi-pod-crashloop
        title: "Pod restart rate elevated"
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'rate(kube_pod_container_status_restarts_total{namespace="default"}[5m]) > 0'
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is restarting"
