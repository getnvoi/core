  "/api/v1/agents/tools":
    "get":
      "summary": "List the tools an agent sets a level for, by category"
      "tags":
        - "utils"
      "responses":
        "200":
          "content":
            "application/json":
              "example":
                "tools":
                  - "asks": true
                    "category": "Sessions"
                    "label": "Question"
                    "level": "approval"
                    "name": "ask_user"
                    "outbound": false
                  - "asks": false
                    "category": "Repositories"
                    "label": "Push branch"
                    "level": "auto"
                    "name": "push_branch"
                    "outbound": true
                  - "asks": false
                    "category": "Web"
                    "label": "Fetch"
                    "level": "approval"
                    "name": "WebFetch"
                    "outbound": true
              "schema":
                "properties":
                  "tools":
                    "items":
                      "properties":
                        "asks":
                          "type": "boolean"
                        "category":
                          "type": "string"
                        "label":
                          "type": "string"
                        "level":
                          "enum":
                            - "auto"
                            - "approval"
                            - "deny"
                          "type": "string"
                        "name":
                          "type": "string"
                        "outbound":
                          "type": "boolean"
                      "required":
                        - "name"
                        - "label"
                        - "category"
                        - "asks"
                        - "outbound"
                        - "level"
                      "type": "object"
                    "type": "array"
                "required":
                  - "tools"
                "type": "object"
          "description": "tools lists the tools an agent sets a level for, by category, each at its default level"
      "operationId": "utils_agent_tool_list"
